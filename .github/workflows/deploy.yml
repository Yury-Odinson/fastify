name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -e
            BRANCH="${{ github.ref_name }}"

            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin "$BRANCH"
            git pull --ff-only origin "$BRANCH"

            if [ ! -f .env ]; then
              cp .env.example .env
              echo ".env was missing, created from .env.example"
            fi

            docker compose up -d --build --remove-orphans
            docker compose ps -a

            for svc in db app nginx; do
              if ! docker compose ps --status running --services | grep -qx "$svc"; then
                echo "Service '$svc' is not running, printing logs..."
                docker compose logs --tail=150 "$svc" || true
                exit 1
              fi
            done
