<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Profile</title>
	<style>
		:root {
			--bg: #0f172a;
			--panel: #111827;
			--text: #e2e8f0;
			--muted: #94a3b8;
			--accent: #38bdf8;
			--border: #1f2937;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: radial-gradient(circle at top, #1e293b, var(--bg));
			font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
			color: var(--text);
		}

		.card {
			width: min(960px, 92vw);
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 16px;
			padding: 24px;
			display: grid;
			grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
			gap: 24px;
			box-shadow: 0 20px 60px rgba(2, 6, 23, 0.5);
		}

		h1 {
			margin: 0;
			font-size: 24px;
		}

		input {
			color: var(--text);
		}

		.section {
			display: grid;
			gap: 16px;
		}

		.subhead {
			font-size: 12px;
			text-transform: uppercase;
			letter-spacing: 0.1em;
			color: var(--muted);
		}

		ul {
			padding: 0;
			display: grid;
			grid-template-columns: repeat(6, auto);
			gap: 8px;
		}

		li {
			margin: 0 auto;
			list-style: none;
			width: fit-content;

			button {
				width: 42px;
				height: 42px;
				border: none;
				border-radius: 8px;
				background: var(--accent);
				color: #0b1120;
				font-weight: 600;
				cursor: pointer;
			}
		}

		.field {
			display: grid;
			gap: 6px;
		}

		.label {
			font-size: 12px;
			text-transform: uppercase;
			letter-spacing: 0.08em;
			color: var(--muted);
		}

		.value {
			padding: 10px 12px;
			height: 42px;
			border-radius: 10px;
			background: rgba(30, 41, 59, 0.7);
			border: 1px solid var(--border);
		}

		.log {
			overflow-y: scroll;
		}

		.actions {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 12px;
		}

		button {
			padding: 12px;
			border: none;
			border-radius: 10px;
			font-weight: 600;
			cursor: pointer;
		}

		.btn-test {
			background: var(--accent);
			color: #0b1120;
		}

		.btn-logout {
			background: transparent;
			border: 1px solid var(--border);
			color: var(--text);
		}

		@media (max-width: 820px) {
			.card {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>

<body>
	<main class="card">
		<section class="section">
			<h1>Profile</h1>

			<div class="field">
				<div class="label">Name</div>
				<div id="profileName" class="value"></div>
			</div>

			<div class="field">
				<div class="label">Email</div>
				<div id="profileEmail" class="value"></div>
			</div>

			<div class="field">
				<div class="label">Language</div>
				<div id="profileLang" class="value"></div>
			</div>

			<div class="actions">
				<button class="btn-test" id="testApiBtn">Load Profile</button>
				<button class="btn-test" id="checkListBtn">Check list</button>
				<button class="btn-logout" id="logoutBtn">Logout</button>
			</div>

			<div class="field">
				<div class="label">New password</div>
				<input id="newPasswordInput" class="value" type="password" placeholder="New password">
			</div>
			<button class="btn-test" id="changePasswordBtn">Change password</button>

			<div class="field">
				<div class="label">New name</div>
				<input id="newNameInput" class="value" type="text" placeholder="New name">
			</div>
			<button class="btn-test" id="changeNameBtn">Change name</button>

			<div class="field">
				<div class="label">New email</div>
				<input id="newEmailInput" class="value" type="email" placeholder="New email">
			</div>
			<button class="btn-test" id="changeEmailBtn">Change email</button>

			<div class="field">
				<div class="label">New language</div>
				<input id="newLangInput" class="value" type="text" placeholder="New language">
			</div>
			<button class="btn-test" id="changeLangBtn">Change language</button>
		</section>

		<section class="section">
			<div class="subhead">Emotions</div>
			<div class="emotions">
				<ul id="emotionList"></ul>
			</div>

			<div class="field">
				<div class="label">Note (optional)</div>
				<input id="emotionNote" class="value" placeholder="Add a note...">
			</div>

			<div class="field">
				<div class="label">Log</div>
				<div id="log" class="value log" style="min-height: 120px; font-family: monospace; white-space: pre-wrap;"></div>
			</div>
		</section>
	</main>

	<script>
		const API_BASE_URL = "http://127.0.0.1:4000";
		let accessToken = null;

		const logEl = document.getElementById("log");
		const nameEl = document.getElementById("profileName");
		const emailEl = document.getElementById("profileEmail");
		const langEl = document.getElementById("profileLang");
		const noteEl = document.getElementById("emotionNote");
		const emotionListEl = document.getElementById("emotionList");
		const newPasswordEl = document.getElementById("newPasswordInput");
		const newNameEl = document.getElementById("newNameInput");
		const newEmailEl = document.getElementById("newEmailInput");
		const newLangEl = document.getElementById("newLangInput");

		const logMessage = (message) => {
			const time = new Date().toLocaleTimeString();
			logEl.textContent = `[${time}] ${message}\n${logEl.textContent}`;
		};

		const refreshAccessToken = async () => {
			const response = await fetch(`${API_BASE_URL}/api/auth/refresh`, {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				credentials: "include",
				body: JSON.stringify({}),
			});

			const data = await response.json().catch(async () => {
				const text = await response.text().catch(() => "");
				return { raw: text };
			});
			logMessage(`REFRESH -> ${response.status}`);

			if (!response.ok) {
				logMessage(JSON.stringify(data));
				return false;
			}

			accessToken = typeof data.accessToken === "string" ? data.accessToken : null;
			logMessage(accessToken ? "Access token received." : "Access token missing in refresh response.");
			return Boolean(accessToken);
		};

		const loadProfile = async () => {
			if (!accessToken) {
				const refreshed = await refreshAccessToken();
				if (!refreshed) {
					logMessage("No valid session. Please login again.");
					return;
				}
			}

			const requestProfile = async () => {
				const response = await fetch(`${API_BASE_URL}/api/me`, {
					method: "GET",
					headers: {
						Authorization: `Bearer ${accessToken}`,
					},
				});
				const data = await response.json();
				return { response, data };
			};

			try {
				let { response, data } = await requestProfile();
				logMessage(`GET /api/me -> ${response.status}`);

				if (response.status === 401) {
					const refreshed = await refreshAccessToken();
					if (refreshed) {
						({ response, data } = await requestProfile());
						logMessage(`GET /api/me (retry) -> ${response.status}`);
					}
				}

				if (!response.ok) {
					logMessage(JSON.stringify(data));
					return;
				}

				nameEl.textContent = data.name ?? "—";
				emailEl.textContent = data.email ?? "—";
				langEl.textContent = data.lang ?? "—";
				logMessage("Profile updated.");
			} catch (error) {
				logMessage(`Request failed: ${error}`);
			}
		};

		const sendMood = async (moodId) => {
			if (!accessToken) {
				const refreshed = await refreshAccessToken();
				if (!refreshed) {
					logMessage("No valid session. Please login again.");
					return;
				}
			}

			const payload = { moodId };
			const noteValue = (noteEl.value || "").trim();
			if (noteValue) {
				payload.note = noteValue;
			}

			const postMood = async () => {
				const response = await fetch(`${API_BASE_URL}/api/mood`, {
					method: "POST",
					headers: {
						"Content-Type": "application/json",
						Authorization: `Bearer ${accessToken}`,
					},
					body: JSON.stringify(payload),
				});
				const data = await response.json().catch(() => ({}));
				return { response, data };
			};

			try {
				let { response, data } = await postMood();
				logMessage(`POST /api/mood -> ${response.status}`);

				if (response.status === 401) {
					const refreshed = await refreshAccessToken();
					if (refreshed) {
						({ response, data } = await postMood());
						logMessage(`POST /api/mood (retry) -> ${response.status}`);
					}
				}

				if (!response.ok) {
					logMessage(JSON.stringify(data));
					return;
				}

				logMessage(`Mood ${moodId} sent.`);
			} catch (error) {
				logMessage(`Mood request failed: ${error}`);
			}
		};

		const loadMoodList = async () => {
			if (!accessToken) {
				const refreshed = await refreshAccessToken();
				if (!refreshed) {
					logMessage("No valid session. Please login again.");
					return;
				}
			}

			const requestMoodList = async () => {
				const response = await fetch(`${API_BASE_URL}/api/mood?page=1&limit=20`, {
					method: "GET",
					headers: {
						Authorization: `Bearer ${accessToken}`,
					},
				});
				const data = await response.json().catch(async () => {
					const text = await response.text().catch(() => "");
					return { raw: text };
				});
				return { response, data };
			};

			try {
				let { response, data } = await requestMoodList();
				logMessage(`GET /api/mood -> ${response.status}`);

				if (response.status === 401) {
					const refreshed = await refreshAccessToken();
					if (refreshed) {
						({ response, data } = await requestMoodList());
						logMessage(`GET /api/mood (retry) -> ${response.status}`);
					}
				}

				if (!response.ok) {
					logMessage(JSON.stringify(data));
					return;
				}


				console.log(data);
				logMessage(`Mood list: ${JSON.stringify(data)}`);
			} catch (error) {
				logMessage(`Mood list request failed: ${error}`);
			}
		};

		const changePassword = async () => {
			const newPassword = (newPasswordEl.value || "").trim();
			if (!newPassword) {
				logMessage("New password is empty.");
				return;
			}

			if (!accessToken) {
				const refreshed = await refreshAccessToken();
				if (!refreshed) {
					logMessage("No valid session. Please login again.");
					return;
				}
			}

			const requestChangePassword = async () => {
				const response = await fetch(`${API_BASE_URL}/api/changeUserPassword`, {
					method: "POST",
					headers: {
						"Content-Type": "application/json",
						Authorization: `Bearer ${accessToken}`,
					},
					body: JSON.stringify({ newPassword }),
				});
				const data = await response.json().catch(async () => {
					const text = await response.text().catch(() => "");
					return { raw: text };
				});
				return { response, data };
			};

			try {
				let { response, data } = await requestChangePassword();
				logMessage(`POST /api/newPassword -> ${response.status}`);

				if (response.status === 401) {
					const refreshed = await refreshAccessToken();
					if (refreshed) {
						({ response, data } = await requestChangePassword());
						logMessage(`POST /api/newPassword (retry) -> ${response.status}`);
					}
				}

				if (!response.ok) {
					logMessage(JSON.stringify(data));
					return;
				}

				newPasswordEl.value = "";
				logMessage("Password changed.");
			} catch (error) {
				logMessage(`Password change failed: ${error}`);
			}
		};

		const changeName = async () => {
			const newName = (newNameEl.value || "").trim();
			if (!newName) {
				logMessage("New name is empty.");
				return;
			}

			if (!accessToken) {
				const refreshed = await refreshAccessToken();
				if (!refreshed) {
					logMessage("No valid session. Please login again.");
					return;
				}
			}

			const requestChangeName = async () => {
				const response = await fetch(`${API_BASE_URL}/api/changeUserName`, {
					method: "POST",
					headers: {
						"Content-Type": "application/json",
						Authorization: `Bearer ${accessToken}`,
					},
					body: JSON.stringify({ newName }),
				});
				const data = await response.json().catch(async () => {
					const text = await response.text().catch(() => "");
					return { raw: text };
				});
				return { response, data };
			};

			try {
				let { response, data } = await requestChangeName();
				logMessage(`POST /api/changeUserName -> ${response.status}`);

				if (response.status === 401) {
					const refreshed = await refreshAccessToken();
					if (refreshed) {
						({ response, data } = await requestChangeName());
						logMessage(`POST /api/changeUserName (retry) -> ${response.status}`);
					}
				}

				if (!response.ok) {
					logMessage(JSON.stringify(data));
					return;
				}

				newNameEl.value = "";
				logMessage("Name changed.");
			} catch (error) {
				logMessage(`Name change failed: ${error}`);
			}
		};

		const changeEmail = async () => {
			const newEmail = (newEmailEl.value || "").trim();
			if (!newEmail) {
				logMessage("New email is empty.");
				return;
			}

			if (!accessToken) {
				const refreshed = await refreshAccessToken();
				if (!refreshed) {
					logMessage("No valid session. Please login again.");
					return;
				}
			}

			const requestChangeEmail = async () => {
				const response = await fetch(`${API_BASE_URL}/api/changeUserEmail`, {
					method: "POST",
					headers: {
						"Content-Type": "application/json",
						Authorization: `Bearer ${accessToken}`,
					},
					body: JSON.stringify({ newEmail }),
				});
				const data = await response.json().catch(async () => {
					const text = await response.text().catch(() => "");
					return { raw: text };
				});
				return { response, data };
			};

			try {
				let { response, data } = await requestChangeEmail();
				logMessage(`POST /api/changeUserEmail -> ${response.status}`);

				if (response.status === 401) {
					const refreshed = await refreshAccessToken();
					if (refreshed) {
						({ response, data } = await requestChangeEmail());
						logMessage(`POST /api/changeUserEmail (retry) -> ${response.status}`);
					}
				}

				if (!response.ok) {
					logMessage(JSON.stringify(data));
					return;
				}

				newEmailEl.value = "";
				logMessage("Email changed.");
			} catch (error) {
				logMessage(`Email change failed: ${error}`);
			}
		};

		const changeLang = async () => {
			const newLang = (newLangEl.value || "").trim();
			if (!newLang) {
				logMessage("New language is empty.");
				return;
			}

			if (!accessToken) {
				const refreshed = await refreshAccessToken();
				if (!refreshed) {
					logMessage("No valid session. Please login again.");
					return;
				}
			}

			const requestChangeLang = async () => {
				const response = await fetch(`${API_BASE_URL}/api/changeUserLang`, {
					method: "POST",
					headers: {
						"Content-Type": "application/json",
						Authorization: `Bearer ${accessToken}`,
					},
					body: JSON.stringify({ newLang }),
				});
				const data = await response.json().catch(async () => {
					const text = await response.text().catch(() => "");
					return { raw: text };
				});
				return { response, data };
			};

			try {
				let { response, data } = await requestChangeLang();
				logMessage(`POST /api/changeUserLang -> ${response.status}`);

				if (response.status === 401) {
					const refreshed = await refreshAccessToken();
					if (refreshed) {
						({ response, data } = await requestChangeLang());
						logMessage(`POST /api/changeUserLang (retry) -> ${response.status}`);
					}
				}

				if (!response.ok) {
					logMessage(JSON.stringify(data));
					return;
				}

				newLangEl.value = "";
				logMessage("Language changed.");
			} catch (error) {
				logMessage(`Language change failed: ${error}`);
			}
		};

		for (let i = 1; i <= 24; i++) {
			const li = document.createElement("li");
			const btn = document.createElement("button");
			btn.textContent = i.toString();
			btn.addEventListener("click", () => sendMood(i));
			li.appendChild(btn);
			emotionListEl.appendChild(li);
		}

		document.getElementById("testApiBtn").addEventListener("click", loadProfile);
		document.getElementById("checkListBtn").addEventListener("click", loadMoodList);
		document.getElementById("changePasswordBtn").addEventListener("click", changePassword);
		document.getElementById("changeNameBtn").addEventListener("click", changeName);
		document.getElementById("changeEmailBtn").addEventListener("click", changeEmail);
		document.getElementById("changeLangBtn").addEventListener("click", changeLang);

		document.getElementById("logoutBtn").addEventListener("click", () => {
			accessToken = null;
			logMessage("Logged out. Access token cleared.");
			window.location.href = "index.html";
		});
	</script>
</body>

</html>
