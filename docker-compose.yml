services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mind_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mind_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://postgres:postgres@db:5432/mind_tracker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./:/app
    # command: sh -c "bunx tsc -p tsconfig.json && bunx drizzle-kit generate && bunx drizzle-kit migrate && bun src/db/seeds/moods.seed.ts"


volumes:
  pg_data:
